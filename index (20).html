<style>

/* ========= TRIPS, FARES, SEGMENT AVAILABILITY ========= */
function tripsFor(date){return OPS.flatMap(o=>o.times.map(t=>({id:`${date}|${o.id}|${t}`,date,op:o,time:t,bus:`${o.id.slice(0,3).toUpperCase().replace(/\W/g,'')}-${100+hash(o.id+t)%900}`})))}
const tripById=id=>tripsFor(id.split('|')[0]).find(x=>x.id===id);
const blocked=(tr,s)=>s===1&&hash(tr.id)%3===0;
const SEEDC=new Map();
function seeds(tr){let o=SEEDC.get(tr.id);if(o)return o;o=[];for(let s=1;s<=SEATS;s++){if(s===11||s===12)continue;const h=hash(tr.id+s);if(h%4===0)o.push({seat:s,from:h%2,to:2+(h>>>3)%2,status:'Boarded',seed:1})}SEEDC.set(tr.id,o);return o}
const allB=tr=>[...seeds(tr),...S.bookings.filter(b=>b.tripId===tr.id&&b.status!=='Cancelled')];
const hk=(tr,s)=>tr.id+'#'+s;
const departed=(tr,f)=>new Date(tr.date+'T'+tr.time+':00').getTime()+Math.round(STOPS[f].km*MPK)*60000<=Date.now(); // bus already passed boarding stop f
function sweep(){const n=Date.now();for(const k in S.holds)if(S.holds[k].exp<=n)delete S.holds[k]}
function fare(op,f,t,cat){const km=STOPS[t].km-STOPS[f].km,b=Math.round(Math.max(FARE.min,(FARE.base+km*FARE.perKm)*op.mult)*4)/4,d=Math.round(b*(CATS[cat]||0)*100)/100;return{km,base:b,disc:d,total:Math.round((b-d)*100)/100}}
/* A seat is reusable for [f,t) only when no booking overlaps AND every earlier passenger on that seat has CONFIRMED exit (status Alighted).
   Scheduled arrival time never frees a seat. */
function seatState(tr,s,f,t){
 if(blocked(tr,s))return'blocked';let st='free';
 for(const b of allB(tr)){if(b.seat!==s)continue;if(b.from<t&&f<b.to)return'occupied';if(b.to<=f&&b.status!=='Alighted')st='pending'}
 sweep();const h=S.holds[hk(tr,s)];
 if(h&&h.pax!==S.pax)return'held';
 if(st==='free'&&h)return'mine';return st}
const avail=(tr,f,t)=>{let n=0;for(let s=1;s<=SEATS;s++){const x=seatState(tr,s,f,t);if(x==='free'||x==='mine')n++}return n};

/* ========= TICKETS & RECEIPTS ========= */
function qrFallback(txt){let r=hash(txt),c='';const n=21,F=(x,y)=>`<path d="M${x} ${y}h7v7h-7z" fill="#000"/><path d="M${x+1} ${y+1}h5v5h-5z" fill="#fff"/><path d="M${x+2} ${y+2}h3v3h-3z" fill="#000"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;r=(r*1103515245+12345)>>>0;if((r>>>16)&1)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return`<svg viewBox="0 0 21 21" width="150" height="150" role="img" aria-label="Demo ticket pattern" style="background:#fff;padding:6px;border-radius:8px">${F(0,0)}${F(14,0)}${F(0,14)}<g fill="#000">${c}</g></svg>`}
/* Ticket code = reference + checksum. Real QR (qrcodejs). Verified by staff scan below. A production system must sign and verify on a server. */
const tcode=b=>`LSB|${b.id}|${b.txRef}|${hash(b.id+b.txRef)}`;
function drawQR(code){try{new QRCode($('#qrbox'),{text:code,width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qrbox').innerHTML=qrFallback(code)}}
async function camScan(onCode){if(!('BarcodeDetector' in window))return toast('Camera QR scanning needs Chrome or Edge. Paste the ticket code instead.');
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=document.createElement('video');v.srcObject=st;v.playsInline=true;v.muted=true;v.style.cssText='width:100%;max-width:360px;border-radius:12px;margin-top:10px';$('#cam').replaceChildren(v);await v.play();
  const det=new BarcodeDetector({formats:['qr_code']}),stop=()=>st.getTracks().forEach(t=>t.stop());
  const loop=async()=>{if(!v.isConnected)return stop();try{const r=await det.detect(v);if(r[0]){stop();$('#cam').replaceChildren();return onCode(r[0].rawValue)}}catch(e){}requestAnimationFrame(loop)};loop()}
 catch(e){toast('Camera blocked. Allow camera access or paste the code.')}}
function validateTicket(code){const p=String(code).trim().split('|'),b=S.bookings.find(x=>x.id===p[1]);

 if(UI.opTrip&&b.tripId!==UI.opTrip)return toast('This ticket is for a different trip. Select that trip first.');
 if(b.status==='Cancelled')return toast('This ticket was cancelled.');
 if(b.status!=='Confirmed')return toast(`Ticket already used (${b.status}).`);

/* Tap-to-board: a paid booking is checked in AND boarded automatically when its card is tapped. No staff step needed. */
function tapBoard(card){const c=S.cards[card];if(!c)return toast('Card not recognised.');if(c.status!=='Active')return toast('Card is blocked. Ask staff for help.');

 if(!b)return toast('No paid booking is waiting for this card.');
 setStatus(b,'Checked In');setStatus(b,'Boarded');note(b.pax,`Boarded automatically. Seat ${b.seat}. Have a safe trip.`);
 S.log.unshift({ts:stamp(),who:'Card reader',action:'Auto boarding by card tap',rec:`${b.id} seat ${b.seat}`});render();toast(`${b.name} boarded. Seat ${b.seat}.`)}
function registerCard(v){v=norm(v);if(v.length<8)return toast('Enter at least 8 digits of the card number.');

function showReceipt(id){const b=S.bookings.find(x=>x.id===id),tr=tripById(b.tripId);UI.mode='rc';

/* ========= MY BOOKINGS ========= */
const STAGES=['Booked','Checked In','Boarded','Approaching','Alighted','Completed'];
function stageIdx(s){return{'Confirmed':0,'Checked In':1,'Boarded':2,'Approaching Destination':3,'Alighting Pending':3,'Alighted':5}[s]}
function rTrips(){const mine=S.bookings.filter(b=>b.pax===S.pax).reverse(),ns=S.notes.filter(n=>n.pax===S.pax),w=S.watch.filter(x=>x.pax===S.pax);
 app.innerHTML=`<div class="wrap sec"><h2>My bookings</h2><div class="list">${mine.length?mine.map(b=>{const tr=tripById(b.tripId),i=stageIdx(b.status);return`<article class="card"><div class="meta"><b style="color:var(--ink)">${esc(tr.op.id)} · ${tr.bus}</b><span>${tr.date} ${tr.time}</span><span>Seat ${b.seat}</span><span>${peso(b.fare)}</span><span class="badge ${b.status==='Cancelled'?'r':'b'}">${b.status}</span></div>
 <h3 style="margin:8px 0 0">${STOPS[b.from].n} → ${STOPS[b.to].n}</h3>
 ${b.status!=='Cancelled'?`<div class="steps">${STAGES.map((s,k)=>`<span class="${k<=i?'on':''}">${s}</span>`).join('')}</div>`:''}
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="rcpt" data-id="${b.id}">Ticket & receipt</button>
 ${b.status==='Confirmed'?`<button class="btn t sm" data-act="tapme" data-id="${b.id}">Tap card to board</button> <button class="btn g sm" data-act="cancel" data-id="${b.id}">Cancel & refund</button>`:''}
 ${['Approaching Destination','Alighting Pending'].includes(b.status)?`<button class="btn t sm" data-act="selfexit" data-id="${b.id}">I have got off</button>`:''}</div></article>`}).join(''):`<div class="empty"><b>No bookings yet.</b><br>Find a bus and reserve a seat to see it here.</div>`}</div>
 ${w.length?`<h3 style="margin-top:24px">Waiting for a seat</h3>${w.map(x=>`<p class="mut">Seat ${x.seat} on ${esc(x.tripId.split('|')[1])} ${x.tripId.split('|')[2]}, from ${STOPS[x.from].n}. We will notify you once the previous passenger's exit is confirmed.</p>`).join('')}`:''}
 <h3 style="margin-top:24px">Notifications</h3><div class="list">${ns.length?ns.slice(0,12).map(n=>`<div class="card" style="padding:10px 14px"><b>${esc(n.text)}</b><div class="mut" style="font-size:12px">${n.ts} · in-app (email/SMS/push need extra infrastructure)</div></div>`).join(''):'<div class="empty">Nothing yet.</div>'}</div></div>`;
 S.notes.forEach(n=>{if(n.pax===S.pax)n.read=true});save();renderNav()}
/* ========= TRANSIT CARD ========= */
function rCard(){const num=PAX[S.pax].card,c=S.cards[num],tx=S.txs.filter(x=>x.card===num);
 app.innerHTML=`<div class="wrap sec"><h2>Transit card</h2><div class="grid"><div class="cardviz"><div>${BRAND} · demo card</div><div><div class="bal">${peso(c.bal)}</div><div>${mask(num)} · ${esc(PAX[S.pax].name)} · ${c.status}</div></div></div>
 <div class="card"><h3>Top up (simulated)</h3><p class="mut">No real money moves. A live version needs a payment provider.</p><div style="display:flex;gap:8px;flex-wrap:wrap">${[100,200,500].map(a=>`<button class="btn sm" data-act="topup" data-a="${a}">+${peso(a)}</button>`).join('')}</div>
 <h3 style="margin-top:16px">Link a card</h3><div style="display:flex;gap:8px"><input id="lc" placeholder="Card number" aria-label="Card number" inputmode="numeric"><button class="btn g sm" data-act="link">Link</button></div>
 <h3 style="margin-top:16px">Card safety</h3><button class="btn r sm" data-act="block" ${c.status!=='Active'?'disabled':''}>Report lost / block card</button>${c.status!=='Active'?'<p class="mut" style="margin-top:8px">Blocked. Staff must reissue in a real system.</p>':''}</div></div>
 <h3 style="margin-top:26px">Transactions</h3><div class="card tw"><table><thead><tr><th>Date</th><th>Reference</th><th>Details</th><th>Status</th><th>Amount</th></tr></thead><tbody>${tx.length?tx.map(x=>`<tr><td>${x.ts}</td><td>${x.ref}</td><td>${esc(x.desc)}</td><td><span class="badge ${x.status==='Successful'?'g':x.status==='Failed'?'r':'o'}">${x.status}</span></td><td>${x.type==='fare'?'−':'+'}${peso(x.amt)}</td></tr>`).join(''):'<tr><td colspan="5" class="mut">No transactions yet.</td></tr>'}</tbody></table></div></div>`}
/* ========= ROUTES & STATIONS ========= */
function rRoutes(){const q=UI.q.toLowerCase(),st=STOPS.filter(s=>(s.n+s.m).toLowerCase().includes(q));
 app.innerHTML=`<div class="wrap sec"><h2>Bus companies</h2><div class="grid">${OPS.map(o=>`<article class="card"><span class="badge o">Sample data</span><h3 style="margin-top:8px">${esc(o.id)}</h3><p class="mut" style="margin-bottom:6px">Route: Sta. Cruz → Cubao → Buendia → Alabang<br>${o.type} · about ${Math.round(STOPS[3].km*MPK)} min · ${SEATS} seats<br>Departures: ${o.times.join(', ')}</p><p class="note">${o.ann}</p>
 <div style="display:flex;gap:8px;margin-top:12px"><button class="btn g sm" data-act="company" data-o="${esc(o.id)}">View buses</button><button class="btn sm" data-act="company" data-o="${esc(o.id)}">Book now</button></div></article>`).join('')}</div>
 <h2 style="margin-top:34px">Route map (schematic)</h2><div class="card" style="padding:34px 30px 52px"><div class="line" style="margin:0;max-width:none">${STOPS.map((s,i)=>`<i class="stop" style="border-color:var(--card);box-shadow:0 0 0 2px var(--navy)"><span style="color:var(--ink)">${s.n}<br><small class="mut">${s.km} km</small></span></i>${i<3?'<div class="seg sC"></div>':''}`).join('')}</div></div>
 <h2 style="margin-top:34px">Station directory</h2><label style="max-width:360px">Search stations<input id="q" value="${esc(UI.q)}" placeholder="Name or city" data-inp="q"></label>
 <div class="grid" style="margin-top:14px">${st.length?st.map(s=>`<div class="card"><h3>${s.n} terminal</h3><p class="mut">${s.m}<br>Address, hours and landmarks: not verified (placeholder).<br>Routes: all four companies (sample).</p></div>`).join(''):'<div class="empty">No station matches. Try a different name.</div>'}</div></div>`}
/* ========= BUS TRACKING (Leaflet + OpenStreetMap). Live = staff phone GPS (same browser until a backend exists); otherwise demo playback ========= */
let PLAY,GPSW,MAP,MARK;
function dropMap(){try{if(MAP)MAP.remove()}catch(e){}MAP=MARK=null}
function posAt(p){const T=STOPS[STOPS.length-1].km,d=p*T;let i=0;while(i<STOPS.length-2&&d>=STOPS[i+1].km)i++;const a=STOPS[i],b=STOPS[i+1],t=Math.min(1,(d-a.km)/(b.km-a.km));return{lat:a.lat+(b.lat-a.lat)*t,lng:a.lng+(b.lng-a.lng)*t,i,next:i+1,d}}
function moveBus(){const el=$('#trkinfo');if(!el)return;const g=(S.gps||{})[UI.trk],live=g&&Date.now()-g.ts<120000;let ll;
 if(live){ll=[g.lat,g.lng];el.textContent='Live GPS from staff device · updated '+Math.round((Date.now()-g.ts)/1000)+'s ago'}
 else{const q=posAt(UI.prog),tr=tripById(UI.trk);ll=[q.lat,q.lng];el.textContent=`Demo playback · ${Math.round(q.d)} km from ${STOPS[0].n} · next stop ${STOPS[q.next].n}, scheduled ${stopTime(tr,q.next)}`}
 if(MARK)MARK.setLatLng(ll)}
function rTrack(){const trs=tripsFor(today());if(!trs.find(x=>x.id===UI.trk))UI.trk=(S.bookings.find(b=>trs.find(x=>x.id===b.tripId))||{}).tripId||trs[0].id;
 app.innerHTML=`<div class="wrap sec"><h2>Track the bus</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px"><label>Trip today<select data-chg="trk">${trs.map(x=>`<option value="${esc(x.id)}" ${x.id===UI.trk?'selected':''}>${x.op.id} ${x.bus} · departs ${x.time}</option>`).join('')}</select></label><label>Demo playback position<input type="range" id="prog" min="0" max="1000" value="${UI.prog*1000}"></label></div>
 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><button class="btn sm" id="playb" data-act="play">${PLAY?'Pause':'Play demo'}</button><span id="trkinfo" class="badge b" style="white-space:normal"></span></div>
 <div id="map" role="region" aria-label="Bus route map"></div><p class="mut" style="font-size:13px;margin-top:10px">Live position appears when staff share GPS on the Operator page (same browser only until a backend is added). Otherwise the bus moves in demo playback. The dashed line is schematic, not the road.</p></div>`;
 dropMap();if(typeof L==='undefined'){$('#map').innerHTML='<div class="empty">Map library did not load. Check your connection. The status above still updates.</div>'}
 else{MAP=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(MAP);const pts=STOPS.map(x=>[x.lat,x.lng]);L.polyline(pts,{color:'#2563eb',weight:4,dashArray:'6 8'}).addTo(MAP);
  STOPS.forEach(x=>L.circleMarker([x.lat,x.lng],{radius:7,color:'#0b1f4a',fillColor:'#fff',fillOpacity:1,weight:3}).addTo(MAP).bindTooltip(x.n,{permanent:true,direction:'right'}));
  MARK=L.marker(pts[0],{icon:L.divIcon({html:'🚌',className:'busico',iconSize:[30,30]})}).addTo(MAP);MAP.fitBounds(pts,{padding:[30,30]})}
 moveBus()}
/* ========= OPERATOR DASHBOARD ========= */
function setStatus(b,s){b.status=s;const tr=tripById(b.tripId);logIt(`Status → ${s}`,`${b.id} seat ${b.seat}`);
 if(s==='Approaching Destination')note(b.pax,`Approaching ${STOPS[b.to].n}. Get ready to alight.`);
 if(s==='Alighting Pending')note(b.pax,`Please confirm you got off at ${STOPS[b.to].n}.`);
 if(s==='Alighted'){note(b.pax,`Trip completed. Thank you for riding ${tr.op.id}.`);S.log.unshift({ts:stamp(),who:who(),action:'Seat handover recorded',rec:`Seat ${b.seat} released at ${STOPS[b.to].n} (${tr.bus})`});
  S.watch=S.watch.filter(w=>{if(w.tripId===b.tripId&&w.seat===b.seat&&w.from>=b.to){note(w.pax,`Seat ${w.seat} is ready for you on ${tr.op.id} from ${STOPS[w.from].n}. Book it now.`);return false}return true})}}
function rOps(){const ids=[...new Set(S.bookings.map(b=>b.tripId))];if(!ids.includes(UI.opTrip))UI.opTrip=ids[0]||null;const tr=UI.opTrip&&tripById(UI.opTrip),bk=tr?S.bookings.filter(b=>b.tripId===tr.id&&b.status!=='Cancelled'):[];
 const nx=bk.filter(b=>['Boarded','Approaching Destination','Alighting Pending'].includes(b.status)).sort((a,b)=>a.to-b.to)[0];
 app.innerHTML=`<div class="wrap sec"><h2>Operator dashboard</h2><p class="mut">For staff use while the bus is stopped. Role: Station / boarding staff (demo).</p>
 <div class="card" style="margin-bottom:14px"><h3>Boarding reader: tap to board</h3><p class="mut">A paid passenger is checked in and marked Boarded automatically when their card is tapped. No staff confirmation needed.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn t sm" data-act="tapnfc">Read NFC card</button><select id="tapc" aria-label="Demo card" style="width:auto">${Object.keys(S.cards).map(c=>`<option value="${c}">${mask(c)} ${esc(PAX[S.cards[c].owner].name)}</option>`).join('')}</select><button class="btn g sm" data-act="tapdemo">Simulate tap</button></div></div>
 <div class="card" style="margin-bottom:14px"><h3>Fallback: validate a QR ticket</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn t sm" data-act="vscan">Scan QR with camera</button><input id="tc" placeholder="Or paste ticket code (LSB|BK…)" aria-label="Ticket code" style="flex:1;min-width:200px"><button class="btn g sm" data-act="vcode">Validate</button></div><div id="cam"></div></div>
 ${tr?`<label style="max-width:420px">Trip<select data-chg="opTrip">${ids.map(i=>{const x=tripById(i);return`<option value="${esc(i)}" ${i===tr.id?'selected':''}>${x.op.id} ${x.bus} · ${x.date} ${x.time}</option>`}).join('')}</select></label>
 <div class="meta" style="margin:12px 0"><span>Booked seats: ${bk.length}</span><span>Next stop: <b>${nx?STOPS[nx.to].n:'none pending'}</b></span><button class="btn g sm" data-act="delay">Report 10 min delay</button><button class="btn g sm" data-act="gps">Share / stop sharing this device's GPS</button></div>
 <div class="card tw"><table><thead><tr><th>Seat</th><th>Passenger</th><th>Segment</th><th>Status</th><th>Action</th></tr></thead><tbody>${bk.map(b=>`<tr><td>${b.seat}</td><td>${esc(b.name)}</td><td>${STOPS[b.from].n} → ${STOPS[b.to].n}</td><td><span class="badge b">${b.status}</span></td><td>${b.status!=='Alighted'?`<button class="btn sm" data-act="adv" data-id="${b.id}">${OPLBL[b.status]}</button> <button class="btn g sm" data-act="exit" data-id="${b.id}">Assisted exit</button>`:'<span class="badge g">Seat released</span>'}</td></tr>`).join('')}</tbody></table></div>`
 :`<div class="empty"><b>No booked trips yet.</b><br>Switch to Passenger A, book Seat 12 (Sta. Cruz → Cubao), then return here.</div>`}
 <h3 style="margin-top:26px">Trip log & audit trail</h3><div class="card tw"><table><thead><tr><th>Time</th><th>By</th><th>Action</th><th>Record</th></tr></thead><tbody>${S.log.slice(0,12).map(l=>`<tr><td>${l.ts}</td><td>${esc(l.who)}</td><td>${esc(l.action)}</td><td>${esc(l.rec)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">No events yet.</td></tr>'}</tbody></table></div></div>`}
/* ========= ACTIONS ========= */
const ACT={
 nav:d=>{S.view=d.v;render();scrollTo(0,0)},
 open:d=>{UI.trip=d.id;UI.seat=null;rSeat()},
 seat:d=>{if(S.pax==='OP')return toast('Switch to a passenger account to reserve a seat.');const tr=tripById(UI.trip),s=+d.s,st=seatState(tr,s,UI.f,UI.t);
  if(st==='pending'){if(!S.watch.find(w=>w.pax===S.pax&&w.tripId===tr.id&&w.seat===s))S.watch.push({pax:S.pax,tripId:tr.id,seat:s,from:UI.f});save();toast(`Seat ${s} is awaiting exit confirmation. We will notify you when it is ready.`);return}
  for(const k in S.holds)if(S.holds[k].pax===S.pax)delete S.holds[k];
  if(UI.seat===s){UI.seat=null}else{S.holds[hk(tr,s)]={pax:S.pax,exp:Date.now()+HOLD_SEC*1000};UI.seat=s}save();rSeat();dlg.querySelector(`[data-s="${s}"]`)?.focus({preventScroll:true})},
 scan:async()=>{if(S.pax==='OP')return toast('Switch to a passenger to scan a card.');
  if('NDEFReader' in window){try{const r=new NDEFReader();await r.scan();toast('Tap your NFC card on the back of your phone.');r.onreading=e=>nfcRead(e.serialNumber);return}catch(e){toast('NFC not available here. Using your linked card.')}}
  UI.card=PAX[S.pax].card;rSeat()},
 vscan:()=>camScan(validateTicket),vcode:()=>validateTicket($('#tc').value),
 link:()=>registerCard($('#lc').value),
 usecard:()=>{const v=norm($('#cn').value);if(!S.cards[v]){return toast('Card not found. Demo cards: 4500 1234 0001 / 0002.')}if(S.cards[v].owner!==S.pax)return toast('That card is linked to another passenger.');UI.card=v;rSeat()},
 pay,close:()=>dlg.close(),email:()=>toast('Email receipts need an email service. Placeholder only.'),
 rcpt:d=>showReceipt(d.id),
 cancel:d=>{const b=S.bookings.find(x=>x.id===d.id);if(b.status!=='Confirmed')return toast('Only unboarded bookings can be cancelled.');b.status='Cancelled';const c=S.cards[b.card];c.bal=Math.round((c.bal+b.fare)*100)/100;
  const o=S.txs.find(x=>x.ref===b.txRef);o.status='Refunded';S.txs.unshift({ref:'TX-'+(100000+nid()),card:b.card,amt:b.fare,status:'Refunded',type:'refund',ts:stamp(),desc:'Refund '+b.id});note(b.pax,`Booking ${b.id} cancelled. ${peso(b.fare)} refunded.`);logIt('Cancelled and refunded',b.id);render();toast('Booking cancelled and fare refunded.')},
 selfexit:d=>{setStatus(S.bookings.find(x=>x.id===d.id),'Alighted');render();toast('Exit confirmed. Seat released.')},
 adv:d=>{const b=S.bookings.find(x=>x.id===d.id);setStatus(b,ADV[ADV.indexOf(b.status)+1]);render()},
 exit:d=>{setStatus(S.bookings.find(x=>x.id===d.id),'Alighted');render();toast('Exit confirmed by staff. Seat handed over.')},
 tapme:d=>tapBoard(S.bookings.find(x=>x.id===d.id).card),tapdemo:()=>tapBoard($('#tapc').value),
 tapnfc:async()=>{if(!('NDEFReader' in window))return toast('NFC needs Chrome on Android. Use Simulate tap.');try{const r=new NDEFReader();await r.scan();toast('Tap the passenger card on this phone.');r.onreading=e=>tapBoard(norm(e.serialNumber))}catch(e){toast('NFC permission denied.')}},
 play:()=>{if(PLAY){clearInterval(PLAY);PLAY=null;$('#playb').textContent='Play demo';return}$('#playb').textContent='Pause';
  PLAY=setInterval(()=>{if(!$('#map')){clearInterval(PLAY);PLAY=null;return}UI.prog=Math.min(1,UI.prog+.004);$('#prog').value=UI.prog*1000;moveBus();if(UI.prog>=1){clearInterval(PLAY);PLAY=null;$('#playb').textContent='Play demo'}},200)},
 gps:()=>{if(!navigator.geolocation)return toast('GPS is not available on this device.');if(GPSW!=null){navigator.geolocation.clearWatch(GPSW);GPSW=null;return toast('GPS sharing stopped.')}
  const id=UI.opTrip;if(!id)return toast('Select a trip first.');UI.trk=id;
  GPSW=navigator.geolocation.watchPosition(q=>{S.gps=S.gps||{};S.gps[id]={lat:q.coords.latitude,lng:q.coords.longitude,ts:Date.now()};save()},err=>{if(err.code===1){navigator.geolocation.clearWatch(GPSW);GPSW=null;toast('Location permission denied.')}},{enableHighAccuracy:true});toast('Sharing GPS for this trip. Open Track Bus to see it.')},
 delay:()=>{const tr=tripById(UI.opTrip);S.bookings.filter(b=>b.tripId===tr.id&&!['Alighted','Cancelled'].includes(b.status)).forEach(b=>note(b.pax,`${tr.op.id} ${tr.bus} is delayed by about 10 minutes.`));logIt('Delay reported',tr.bus);render();toast('Delay reported to passengers.')},
 topup:d=>{const n=PAX[S.pax].card;S.cards[n].bal+=+d.a;S.txs.unshift({ref:'TX-'+(100000+nid()),card:n,amt:+d.a,status:'Successful',type:'topup',ts:stamp(),desc:'Top-up (simulated)'});render();toast('Top-up added (simulated).')},
 block:()=>{if(!confirm('Block this card? You cannot undo this in the demo.'))return;S.cards[PAX[S.pax].card].status='Blocked';logIt('Card blocked',mask(PAX[S.pax].card));render()},
 company:d=>{UI.op=d.o;S.view='find';render();scrollTo(0,0)},
 bell:()=>{S.view='trips';render();scrollTo(0,0)},
 reset:()=>{if(!confirm('Reset all demo data?'))return;S=fresh();PAX.A.card='450012340001';PAX.B.card='450012340002';Object.assign(UI,{seat:null,card:null,trip:null,opTrip:null});if(dlg.open)dlg.close();render();toast('Demo reset.')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){if(b.tagName==='A')e.preventDefault();ACT[b.dataset.act]?.(b.dataset)}});
document.addEventListener('change',e=>{const k=e.target.dataset.chg;if(!k)return;if(k==='cat'){UI.cat=e.target.value;rSeat()}if(k==='opTrip'){UI.opTrip=e.target.value;rOps()}if(k==='trk'){UI.trk=e.target.value;rTrack()}});
document.addEventListener('input',e=>{if(e.target.id==='prog'){UI.prog=e.target.value/1000;moveBus();return}if(e.target.dataset.inp==='q'){UI.q=e.target.value;const p=e.target.selectionStart;rRoutes();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();const f=+$('#sf-f').value,t=+$('#sf-t').value;
 if(t<=f)return $('#sf-msg').textContent='Choose a destination that comes after your boarding stop.';
 if(!$('#sf-d').value||$('#sf-d').value<today())return $('#sf-msg').textContent='Choose today or a later date.';
 Object.assign(UI,{f,t,date:$('#sf-d').value,time:$('#sf-h').value,op:$('#sf-o').value});res()});
document.addEventListener('change',e=>{if(e.target.id==='sf-f'){UI.t=+$('#sf-t').value;UI.f=+e.target.value;UI.t=Math.max(UI.t,UI.f+1);const d=$('#sf-d').value;if(d&&d>=today())UI.date=d;UI.time=$('#sf-h').value;UI.op=$('#sf-o').value;rFind()}});
$('#role').addEventListener('change',e=>{for(const k in S.holds)if(S.holds[k].pax===S.pax)delete S.holds[k];S.pax=e.target.value;UI.card=null;UI.seat=null;if(dlg.open)dlg.close();render()});
dlg.addEventListener('close',()=>{if(UI.mode==='seat'){for(const k in S.holds)if(S.holds[k].pax===S.pax)delete S.holds[k];UI.seat=null;save();if(S.view==='find')res()}UI.mode=''});
/* seat-hold countdown: expired holds are released automatically */
setInterval(()=>{if(!dlg.open||UI.mode!=='seat')return;sweep();const h=$('#hold');if(UI.seat&&!S.holds[hk(tripById(UI.trip),UI.seat)]){UI.seat=null;toast('Seat hold expired and was released.');rSeat()}else if(h){const x=S.holds[hk(tripById(UI.trip),UI.seat)];h.textContent=Math.max(0,Math.round((x.exp-Date.now())/1000))}},1000);
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue&&$('#trkinfo')){try{S=JSON.parse(e.newValue);moveBus()}catch(x){}}});setInterval(()=>{if($('#trkinfo')&&!PLAY)moveBus()},5000);
S.view=['find','routes','track','trips','card','ops'].includes(location.hash.slice(1))?location.hash.slice(1):S.view;render();
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(Object.hasOwn(VIEWS,v)&&v!==S.view){S.view=v;render();scrollTo(0,0)}});
</script>
