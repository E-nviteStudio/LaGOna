<!--
IMPROVEMENT NOTES (added review comments; no behavior was changed in this file)
Search "IMPROVE:" to find each note. Summary of priorities:
 1. Replace localStorage with a real backend + database (accounts, trips, seats, payments, tickets).
 2. Replace the fake transit-card payment with a Philippine payment gateway (sandbox first).
 3. Sign tickets on the server; stop generating/hashing them in the browser.
 4. Enter only verified operators, routes, schedules and fares; remove hash-generated trips and random occupancy.
 5. Show live tracking only with a real GPS source; otherwise label it a route map.
 6. Add SEO/meta, legal pages (Terms, Privacy, FAQ, Contact, About), and a footer with real contact info.
 7. Self-host Leaflet/qrcode (pin versions, add integrity hashes) and add a Content-Security-Policy.
-->

<!-- IMPROVE: SEO and sharing. Make the title descriptive (e.g. "Laguna Smart Bus | Book Bus Seats, Laguna to Metro Manila"), then add:
     <meta name="description" content="...">, <link rel="canonical">, Open Graph/Twitter tags, a favicon, and a manifest.
     This single-page app has no real URLs; consider hash or path routes (#/routes) so pages can be bookmarked and indexed. -->

<script>
'use strict';
/* IMPROVE:

 * Only list operators/routes after their participation and stop sequence are verified. Do not assume every operator serves every stop.
 * HOLD_SEC=120 is client-side; holds must be created and expired on the server (about 5 to 10 minutes).
 */
/* ========= CONFIG & SAMPLE DATA (all simulated) ========= */
const BRAND='LaGOna', HOLD_SEC=120, SEATS=50, MPK=1.5; // 50-seater: 1 front + 11 rows of 4 + 5 in the back row
/* IMPROVE:
 * Distances (km) are rough sample values. Replace with verified coordinates and route distances per operator route.
 * Store stops per route (ordered), and distinguish terminal / station / stop / city. Also add reverse-direction routes.
 * Travel time here is km * MPK (1.5 min/km): label it 'estimated' in the UI or use scheduled times from the operator.
 */
const STOPS=[{n:'Pagsanjan',km:0,m:'Pagsanjan, Laguna',lat:14.2733,lng:121.4547},{n:'Sta. Cruz',km:4,m:'Santa Cruz, Laguna',lat:14.2785,lng:121.4161},{n:'Pila',km:11,m:'Pila, Laguna',lat:14.2339,lng:121.3626},{n:'Victoria',km:19,m:'Victoria, Laguna',lat:14.2253,lng:121.3278},{n:'Bay',km:33,m:'Bay, Laguna',lat:14.1833,lng:121.2833},{n:'Los Baños',km:39,m:'Los Baños, Laguna',lat:14.1699,lng:121.2437},{n:'Calamba',km:51,m:'Calamba City, Laguna',lat:14.2117,lng:121.1653},{n:'Cabuyao',km:63,m:'Cabuyao City, Laguna',lat:14.2724,lng:121.1251},{n:'Santa Rosa',km:73,m:'Santa Rosa City, Laguna',lat:14.3122,lng:121.1114},{n:'Biñan',km:83,m:'Biñan City, Laguna',lat:14.3333,lng:121.0802},{n:'San Pedro',km:91,m:'San Pedro City, Laguna',lat:14.3595,lng:121.0473},{n:'Muntinlupa',km:99,m:'Muntinlupa City (Alabang)',lat:14.4181,lng:121.03},{n:'Taguig',km:111,m:'Taguig City',lat:14.5176,lng:121.0509},{n:'Makati',km:119,m:'Makati City',lat:14.5547,lng:121.0244},{n:'Pasay (Buendia)',km:125,m:'Pasay City, Buendia',lat:14.5543,lng:121.0123},{n:'Quezon City (Cubao)',km:137,m:'Quezon City, Cubao',lat:14.6197,lng:121.0537}];

const OPS=[{id:'LLI',mult:1,type:'Aircon (sample)',times:['05:30','08:15','13:00','17:45'],ann:'Sample announcement: no active advisories.'},
{id:'HM Transport',mult:1.05,type:'Aircon (sample)',times:['06:00','09:30','14:15','18:30'],ann:'Sample announcement: schedule is for demo only.'},
{id:'DLTB Co.',mult:.95,type:'Ordinary (sample)',times:['05:00','07:45','12:30','16:00'],ann:'Sample announcement: extra trips on weekends (demo).'},
{id:'JAC Liner',mult:1.1,type:'Deluxe (sample)',times:['06:45','10:00','15:00','19:00'],ann:'Sample announcement: seat holds last 2 minutes.'}];

 */
const FARE={base:15,perKm:1.85,min:25}, DISC=.2, CATS={Regular:0,Student:DISC,Senior:DISC,PWD:DISC}; // 20% discount (sample fare rule, not official)
/* IMPROVE:

 */
const PAX={A:{name:'Ana Reyes',card:'450012340001'},B:{name:'Ben Cruz',card:'450012340002'}};

/* ========= HELPERS ========= */

const peso=n=>'₱'+Number(n).toFixed(2), stamp=()=>new Date().toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); // local date, not UTC
const today=()=>ymd(new Date()), mask=c=>'•••• '+String(c).slice(-4);

const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const fmtT=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const stopTime=(tr,i)=>fmtT(+tr.time.slice(0,2)*60+ +tr.time.slice(3)+Math.round(STOPS[i].km*MPK));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
/* IMPROVE:
 * localStorage is not a database: data is per-browser, editable by the user, and lost when cleared. Use a transactional backend.
 * Also remove the passenger/operator role switcher (#role): roles must come from the server and be enforced there.
 * Never mark payments/bookings from client state; the cleanup below that flips Pending to Failed should be a server reconciliation job.
 */
/* ========= STORE (localStorage = prototype only; a real system needs a transactional backend) ========= */
const KEY='lsb_demo_v2';
const fresh=()=>({pax:'A',view:'find',bookings:[],txs:[],cards:{'450012340001':{owner:'A',bal:500,status:'Active'},'450012340002':{owner:'B',bal:300,status:'Active'}},notes:[],incidents:[],reports:[],flags:{},log:[],holds:{},watch:[],link:{},n:1});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
S.reports=S.reports||[];S.link=S.link||{};for(const k in S.link)if(PAX[k]&&S.cards[S.link[k]])PAX[k].card=S.link[k];
S.txs.forEach(x=>{if(x.status==='Pending')x.status='Failed'}); // page closed mid-payment: nothing was charged
/* Booking statuses are only: Booked (passenger reserved) > Checked in (passenger paid) > Completed (operator confirmed passenger got off). Older saved statuses are mapped onto these. */
const LEGACY={'Confirmed':'Checked in','Checked In':'Checked in','Boarded':'Checked in','Approaching Destination':'Checked in','Alighting Pending':'Checked in','Alighted':'Completed'};
S.bookings=S.bookings.filter(b=>b.status!=='Cancelled');S.bookings.forEach(b=>{if(LEGACY[b.status])b.status=LEGACY[b.status]});
const who=()=>S.pax==='OP'?'Staff':(window.AUTH_NAME||PAX[S.pax].name); // real signed-in name when accounts are on
const note=(p,t)=>S.notes.unshift({pax:p,text:t,ts:stamp(),read:false});
const opNote=(t,k)=>S.notes.unshift({pax:'OP',kind:k,text:t,ts:stamp(),read:false}); // update for the operator bell
const logIt=(action,rec)=>S.log.unshift({ts:stamp(),who:who(),action,rec});
const nid=()=>S.n++;
/* ===== Seat plans, per bus. SAMPLE layouts only: real plans must come from each operator's vehicle records. Seat 1 is always the driver. ===== */
const LAYOUTS={L50:{name:'50-seater (2+2)',rows:11,back:5,seats:50},L45:{name:'45-seater (2+2)',rows:10,back:4,seats:45}};
const layoutOf=tr=>hash(tr.bus)%3===0?LAYOUTS.L45:LAYOUTS.L50;
const seatsOf=tr=>layoutOf(tr).seats;
const isOut=tr=>!!(S.flags&&S.flags[tr.id]); // accident or mechanical problem reported: no new bookings
const OFFER_MIN=15; // how long a passenger has to answer a transfer offer
/* ========= TRIPS, FARES, SEGMENT AVAILABILITY ========= */
/* IMPROVE:
 * Trips are generated from fixed time lists and hash-based bus numbers for any date. Real trips must be entered by an authorized admin/operator
 * (operator, vehicle, route, date, departure, fare policy, booking cutoff, status) and only those should be shown.
 */
function tripsFor(date){return OPS.flatMap(o=>o.times.map(t=>({id:`${date}|${o.id}|${t}`,date,op:o,time:t,bus:`${o.id.slice(0,3).toUpperCase().replace(/\W/g,'')}-${100+hash(o.id+t)%900}`})))}
const tripById=id=>tripsFor(id.split('|')[0]).find(x=>x.id===id);
const DRIVER=1; // seat 1 is the driver's seat: never bookable and never counted as a passenger seat (49 passenger seats: 2 to 50)
/* IMPROVE:
 * No seats are marked out of service. Let operators mark individual seats unavailable per vehicle.
 */
const blocked=()=>false;
/* IMPROVE:
 * seeds() fabricates occupied seats at random. Remove it: show only real bookings. Random occupancy misleads passengers about availability.
 */
const DEMO_SEED=false; // true = fill buses with fake sample passengers (old demo behaviour)
const SEEDC=new Map();
function seeds(tr){if(!DEMO_SEED)return[];let o=SEEDC.get(tr.id);if(o)return o;o=[];for(let s=2;s<=seatsOf(tr);s++){if(s===11||s===12)continue;const h=hash(tr.id+s);if(h%4===0){const f=(h>>>5)%(STOPS.length-1);o.push({seat:s,from:f,to:f+1+(h>>>3)%(STOPS.length-1-f),status:'Boarded',seed:1})}}SEEDC.set(tr.id,o);return o}
const incoming=tr=>S.bookings.filter(b=>b.xfer&&b.xfer.status==='Offered'&&b.xfer.toTrip===tr.id); // seats reserved on this bus for passengers offered a transfer
const allB=tr=>[...seeds(tr),...S.bookings.filter(b=>b.tripId===tr.id&&b.status!=='Cancelled'),...incoming(tr).map(b=>({...b,tripId:tr.id,seat:b.xfer.toSeat,status:'Offered'}))];
const hk=(tr,s)=>tr.id+'#'+s;
const departed=(tr,f)=>new Date(tr.date+'T'+tr.time+':00').getTime()+Math.round(STOPS[f].km*MPK)*60000<=Date.now(); // bus already passed boarding stop f
/* IMPROVE:
 * Hold expiry runs in the browser here. Move it to the server: expire holds in the database and re-check at confirmation.
 * Two people on different devices cannot see each other's holds today; a database constraint is needed to prevent double booking.
 */
function sweep(){const n=Date.now();for(const k in S.holds)if(S.holds[k].exp<=n)delete S.holds[k]}
/* IMPROVE:
 * Move to the server. Round per the operator's published rules and return a fare breakdown with the booking.
 */
function fare(op,f,t,cat){const km=STOPS[t].km-STOPS[f].km,b=Math.round(Math.max(FARE.min,(FARE.base+km*FARE.perKm)*op.mult)*4)/4,d=Math.round(b*(CATS[cat]||0)*100)/100;return{km,base:b,disc:d,total:Math.round((b-d)*100)/100}}
/* A seat is reusable for [f,t) only when no booking overlaps AND every earlier passenger on that seat has confirmed exit (status Completed, set by the operator).
   Scheduled arrival time never frees a seat. */
/* IMPROVE:
 * The overlap logic (from < t && f < to) is sound and worth keeping, but it must run in the database (range-overlap exclusion constraint),
 * not only in JS. Decide the policy for 'awaiting exit confirmation' and make it operator-configurable.
 */
function seatState(tr,s,f,t){
 if(s===DRIVER)return'driver';
 if(blocked(tr,s))return'blocked';let st='free';
 for(const b of allB(tr)){if(b.seat!==s||b.status==='Completed')continue;if(b.from<t&&f<b.to)return'occupied';if(b.to<=f&&b.status!=='Offered')st='pending'}
 sweep();const h=S.holds[hk(tr,s)];
 if(isOut(tr)&&(st==='free'||st==='pending'))return'blocked';
 if(h&&h.pax!==S.pax)return'held';
 if(st==='free'&&h)return'mine';return st}
const avail=(tr,f,t)=>{let n=0;for(let s=2;s<=seatsOf(tr);s++){const x=seatState(tr,s,f,t);if(x==='free'||x==='mine')n++}return n};
/* ========= UI STATE ========= */
const UI={f:IX('Sta. Cruz'),t:IX('Quezon City (Cubao)'),date:today(),time:'any',op:'all',cat:'Regular',trip:null,seat:null,card:null,busy:false,mode:'',opTrip:null,q:'',prog:0,trk:null};

const app=$('#app'),dlg=$('#dlg');

function render(){expireOffers();dropMap();renderNav();({report:rReport,inbox:rInbox,incidents:rInci,find:rFind,routes:rRoutes,track:rTrack,trips:rTrips,card:rCard,ops:rOps})[S.view]();document.querySelectorAll('[data-brand]').forEach(e=>e.textContent=BRAND);save()}
/* ========= FIND A BUS ========= */

<label>Departure<select id="sf-h">${['any:Any time','am:Morning (before 12:00)','pm:Afternoon (12:00 to 17:00)','ev:Evening (after 17:00)'].map(x=>{const[v,l]=x.split(':');return`<option value="${v}" ${UI.time===v?'selected':''}>${l}</option>`}).join('')}</select></label>
<label>Bus company<select id="sf-o"><option value="all">All companies</option>${OPS.map(o=>`<option ${UI.op===o.id?'selected':''}>${o.id}</option>`).join('')}</select></label>
<button class="btn t" type="submit">Search buses</button></div><p class="mut" id="sf-msg" style="margin:10px 0 0;font-size:13px">1 passenger per booking in this prototype. Route: Pagsanjan to Quezon City (Cubao), 16 stops (sample corridor).</p></form>

 res()}
function res(){const box=$('#results');if(!box)return;sweep();
 let tr=tripsFor(UI.date).filter(x=>UI.op==='all'||x.op.id===UI.op).filter(x=>{const h=+stopTime(x,UI.f).slice(0,2);return UI.time==='any'||(UI.time==='am'&&h<12)||(UI.time==='pm'&&h>=12&&h<17)||(UI.time==='ev'&&h>=17)}).sort((a,b)=>stopTime(a,UI.f)<stopTime(b,UI.f)?-1:1);

 box.innerHTML=tr.map(x=>{const gone=departed(x,UI.f),a=gone?0:avail(x,UI.f,UI.t),fr=fare(x.op,UI.f,UI.t,'Regular');const bs=gone?['Departed','r']:isOut(x)?['Not available','r']:a===0?['Full','r']:a<=6?['Almost full','o']:['Open','g'];
 return`<article class="card res"><div><div class="meta"><b style="color:var(--ink)">${esc(x.op.id)}</b><span>Bus ${x.bus}</span><span class="badge ${bs[1]}">${bs[0]}</span></div>
 <div class="big">${stopTime(x,UI.f)} ${STOPS[UI.f].n} → ${stopTime(x,UI.t)} ${STOPS[UI.t].n}</div>
 <div class="meta"><span>${x.date}</span><span>${x.op.type}</span><span>Sample fare from ${peso(fr.total)}</span><span>${gone?'Already left your boarding stop':a+' of '+(seatsOf(x)-1)+' seats free for this segment'}</span></div><div class="meter" aria-hidden="true"><i style="width:${a/(seatsOf(x)-1)*100}%"></i></div></div>
 <button class="btn" data-act="open" data-id="${esc(x.id)}" ${a?'':'disabled'}>Select seat</button></article>`}).join('')}

 cancel:d=>{const i=S.bookings.findIndex(x=>x.id===d.id&&x.pax===S.pax);if(i<0)return;const b=S.bookings[i];if(b.status!=='Booked')return toast('Only unpaid bookings can be cancelled.');if(b.xfer)return toast('Respond to the transfer offer first.');S.bookings.splice(i,1);logIt('Booking cancelled',b.id);render();toast('Booking cancelled. Seat released.')},
 paybk:d=>payBooking(d.id),
 incopen:()=>{if(S.pax!=='OP'||!UI.opTrip)return;UI.inc=incNew(UI.opTrip);UI.inc.stop=Math.max(0,+(UI.opStop==null?-1:UI.opStop));S.view='incidents';render();scrollTo(0,0)},
 incsend:()=>incSend(),
 rptbus:d=>{const b=S.bookings.find(x=>x.id===d.id&&x.pax===S.pax);if(!b)return;UI.rp=rpNew();UI.rp.bk=b.id;S.view='report';render();scrollTo(0,0)},
 rptcat:d=>{rpSync();if(!UI.rp)UI.rp=rpNew();UI.rp.cat=d.c;UI.rp.sub='';const y=scrollY;rReport(true);scrollTo(0,y);const f=$('#rp-form');if(f){const t=f.getBoundingClientRect().top;if(t>innerHeight-220)scrollBy({top:t-innerHeight*.45})}},
 rptsend:()=>rptSend(),rptwd:d=>rptWithdraw(d.id),rptset:d=>rptSet(d.id,d.st),
 rptinc:d=>{if(S.pax!=='OP')return;UI.inc=incNew(d.id);UI.inc.type='Accident';S.view='incidents';render();scrollTo(0,0)},
 reopen:d=>{if(S.pax!=='OP')return;const tr=tripById(d.id);if(S.bookings.some(b=>b.xfer&&b.xfer.from===tr.id))return toast('Transfer offers are still waiting for an answer.');{const ri=S.incidents.find(i=>i.id===(S.flags[tr.id]||{}).inc);if(ri)ri.closed=stamp()}delete S.flags[tr.id];logIt('Bus reopened for booking',tr.bus);render();toast('Bus reopened for booking.')},
 xferyes:d=>xferAccept(d.id),
 xferno:d=>{const b=S.bookings.find(x=>x.id===d.id&&x.pax===S.pax);if(!b||!b.xfer)return;if(!confirm('Decline the transfer? Your booking on this trip will end, the seats are released, and any fare you paid goes back to your transit card.'))return;xferDecline(b,'declined');render();toast('Transfer declined. Booking ended.')},
 gettingoff:d=>{const b=S.bookings.find(x=>x.id===d.id&&x.pax===S.pax);if(!b||b.status!=='Checked in'||b.exit||b.xfer)return;b.exit=stamp();const tr=tripById(b.tripId);opNote(`🚪 ${b.name} is getting off · Seat ${b.seat} · at ${STOPS[b.to].n} (${tr.op.id} ${tr.time})`,'out');note(b.pax,'The operator was told you are getting off.');render();toast('Operator notified.')},
 done:d=>{if(S.pax!=='OP')return;const b=S.bookings.find(x=>x.id===d.id);if(!b||b.status!=='Checked in'||b.xfer)return;const tr=tripById(b.tripId);b.status='Completed';b.doneAt=stamp();note(b.pax,`Trip completed. Thank you for riding ${tr.op.id}.`);logIt('Completed',`${b.id} seat ${b.seat}`);
  S.watch=S.watch.filter(w=>{if(w.tripId===b.tripId&&w.seat===b.seat&&w.from>=b.to){note(w.pax,`Seat ${w.seat} is ready for you on ${tr.op.id} from ${STOPS[w.from].n}. Book it now.`);return false}return true});render();toast(`Seat ${b.seat} completed and released.`)},
 delay:()=>{const tr=tripById(UI.opTrip);S.bookings.filter(b=>b.tripId===tr.id&&b.status!=='Completed').forEach(b=>note(b.pax,`${tr.op.id} ${tr.bus} is delayed by about 10 minutes.`));logIt('Delay reported',tr.bus);render();toast('Delay reported to passengers.')},
 topup:d=>{const n=PAX[S.pax].card;S.cards[n].bal+=+d.a;S.txs.unshift({ref:'TX-'+(100000+nid()),card:n,amt:+d.a,status:'Successful',type:'topup',ts:stamp(),desc:'Top-up (simulated)'});render();toast('Top-up added (simulated).')},
 block:()=>{if(!confirm('Block this card? You cannot undo this in the demo.'))return;S.cards[PAX[S.pax].card].status='Blocked';logIt('Card blocked',mask(PAX[S.pax].card));render()},
 company:d=>{UI.op=d.o;S.view='find';render();scrollTo(0,0)},
 bell:()=>{if(S.pax==='OP')return opBell();S.view='trips';render();scrollTo(0,0)},
 reset:()=>{if(!confirm('Reset all demo data?'))return;S=fresh();PAX.A.card='450012340001';PAX.B.card='450012340002';Object.assign(UI,{seat:null,card:null,trip:null,opTrip:null});if(dlg.open)dlg.close();render();toast('Demo reset.')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){if(b.tagName==='A')e.preventDefault();ACT[b.dataset.act]?.(b.dataset)}});
document.addEventListener('change',e=>{const k=e.target.dataset.chg;if(!k)return;if(k==='cat'){UI.cat=e.target.value;rSeat()}if(k==='opTrip'){UI.opTrip=e.target.value;rOps()}if(k==='opDate'){UI.opDate=e.target.value||today();UI.opTrip=null;rOps()}if(k==='opStop'){UI.opStop=+e.target.value;rOps()}if(k==='inc')incSet(e.target.dataset.f,e.target.type==='checkbox'?e.target.checked:e.target.value);if(k==='incseat'&&UI.inc)UI.inc.assign[e.target.dataset.id]=+e.target.value||null;if(k==='trk'){UI.trk=e.target.value;rTrack()}});
document.addEventListener('input',e=>{if(e.target.id==='prog'){UI.prog=e.target.value/1000;moveBus();return}if(e.target.dataset.inp==='q'){UI.q=e.target.value;const p=e.target.selectionStart;rRoutes();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();const f=+$('#sf-f').value,t=+$('#sf-t').value;
 if(t<=f)return $('#sf-msg').textContent='Choose a destination that comes after your boarding stop.';
 if(!$('#sf-d').value||$('#sf-d').value<today())return $('#sf-msg').textContent='Choose today or a later date.';
 Object.assign(UI,{f,t,date:$('#sf-d').value,time:$('#sf-h').value,op:$('#sf-o').value});res()});
document.addEventListener('change',e=>{if(e.target.id==='sf-f'){UI.t=+$('#sf-t').value;UI.f=+e.target.value;UI.t=Math.max(UI.t,UI.f+1);const d=$('#sf-d').value;if(d&&d>=today())UI.date=d;UI.time=$('#sf-h').value;UI.op=$('#sf-o').value;rFind()}});
$('#role').addEventListener('change',e=>{for(const k in S.holds)if(S.holds[k].pax===S.pax)delete S.holds[k];S.pax=e.target.value;if(S.pax==='OP')S.view='ops';UI.card=null;UI.seat=null;if(dlg.open)dlg.close();render()});
dlg.addEventListener('close',()=>{if(UI.mode==='seat'){for(const k in S.holds)if(S.holds[k].pax===S.pax)delete S.holds[k];UI.seat=null;save();if(S.view==='find')res()}UI.mode=''});
/* seat-hold countdown: expired holds are released automatically */
setInterval(()=>{if(!dlg.open||UI.mode!=='seat')return;sweep();const h=$('#hold');if(UI.seat&&!S.holds[hk(tripById(UI.trip),UI.seat)]){UI.seat=null;toast('Seat hold expired and was released.');rSeat()}else if(h){const x=S.holds[hk(tripById(UI.trip),UI.seat)];h.textContent=Math.max(0,Math.round((x.exp-Date.now())/1000))}},1000);
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue&&$('#trkinfo')){try{S=JSON.parse(e.newValue);moveBus()}catch(x){}}});setInterval(()=>{if($('#trkinfo')&&!PLAY)moveBus()},5000);
S.view=['find','routes','track','trips','card','ops'].includes(location.hash.slice(1))?location.hash.slice(1):S.view;render();
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(Object.hasOwn(VIEWS,v)&&v!==S.view){S.view=v;render();scrollTo(0,0)}});
</script>
<!-- Pinned Supabase client. IMPROVE: self-host or add an integrity hash for production. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ========= ACCOUNTS: real sign-up / sign-in through Supabase Auth =========
   SETUP (nothing below works until this is done):
   1) Create a Supabase project.  2) Authentication > Providers > Email: turn ON "Confirm email".
   3) Authentication > URL Configuration: add this site's address to Site URL and Redirect URLs.
   4) Run db/migrations/001_core_schema.sql, then 002_profile_trigger.sql. To give a verified staff member operator access, run db/ops/grant_operator_role.sql for their user.
   5) Paste the Project URL and the PUBLIC anon key below. NEVER paste the service_role key into this file.
   Passwords, email verification, sessions and auth rate limits are handled by Supabase, not by this page. */
const SUPABASE_URL='';       // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY='';  // public anon key only
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let SESSION=null,PENDING_VIEW=null,NOVERIFY=false,ROLE=null;
const ad=document.getElementById('authdlg'),acct=document.getElementById('acct');
const TITLES={signin:'Sign in',signup:'Create your account',forgot:'Reset your password',reset:'Choose a new password',verify:'Check your email',off:'Accounts are not set up yet'};
const phone=v=>{const d=String(v).replace(/[\s\-()]/g,''),m=/^(?:\+63|63|0)(9\d{9})$/.exec(d);return m?'+63'+m[1]:null};
const mailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const fld=(l,n,t,ex)=>`<label>${l}<input name="${n}" type="${t}" ${ex||''} required></label>`;
const sub=l=>`<p id="aerr" class="aerr" role="alert"></p><button class="btn t" type="submit" id="asub" data-label="${l}" style="width:100%">${l}</button>`;
function authBody(mode,msg){
 if(mode==='off')return `${SUPABASE_URL&&!window.supabase?'<p class="note">The Supabase library could not be loaded. Check your connection.</p>':''}<p>Real accounts are not switched on in this copy of the site, so nothing can be created or signed in yet.</p><p class="mut" style="font-size:13px">To turn them on: create a Supabase project, enable "Confirm email", run the SQL files in <code>db/migrations</code>, then put the project URL and public anon key in <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the end of this HTML file.</p>`;
 if(mode==='verify')return `<p>${msg}</p><p class="mut" style="font-size:13px">Open the link in the email, then sign in. Check your spam folder if you do not see it.</p><button class="btn t" type="button" data-auth="signin" style="margin-top:8px">Go to sign in</button>`;
 if(mode==='signup')return `<form id="af" novalidate>${fld('Full name','name','text','autocomplete="name" maxlength="120"')}${fld('Email','email','email','autocomplete="email"')}${fld('Mobile number (Philippines)','mobile','tel','autocomplete="tel" placeholder="0917 123 4567" inputmode="tel"')}${fld('Password (10+ characters)','pw','password','autocomplete="new-password"')}${fld('Confirm password','pw2','password','autocomplete="new-password"')}
 <label class="chk"><input type="checkbox" name="terms"><span>I have read and accept the <button class="lnk" type="button" data-doc="Terms and Conditions">Terms and Conditions</button> and <button class="lnk" type="button" data-doc="Privacy Policy">Privacy Policy</button>.</span></label>${sub('Create account')}</form><p class="alinks">Already have an account? <button class="lnk" type="button" data-auth="signin">Sign in</button></p>`;
 if(mode==='forgot')return `<form id="af" novalidate>${fld('Email','email','email','autocomplete="email"')}${sub('Send reset link')}</form><p class="alinks"><button class="lnk" type="button" data-auth="signin">Back to sign in</button></p>`;
 if(mode==='reset')return `<form id="af" novalidate>${fld('New password (10+ characters)','pw','password','autocomplete="new-password"')}${fld('Confirm new password','pw2','password','autocomplete="new-password"')}${sub('Update password')}</form>`;
 return `<form id="af" novalidate>${fld('Email','email','email','autocomplete="email"')}${fld('Password','pw','password','autocomplete="current-password"')}${sub('Sign in')}</form><p class="alinks"><button class="lnk" type="button" data-auth="forgot">Forgot password?</button> · <button class="lnk" type="button" data-auth="signup">Create an account</button></p>`}
function showAuth(mode,msg){const m=sb?mode:'off';ad.dataset.mode=m;
 ad.innerHTML=`<div class="dh"><h3 style="margin:0">${TITLES[m]}</h3><button class="btn g sm" type="button" data-act="authclose">Close</button></div><div class="db">${msg&&m!=='verify'?`<p class="note">${esc(msg)}</p>`:''}${authBody(m,msg)}</div>`;
 if(!ad.open)ad.showModal();const f=ad.querySelector('input');if(f)f.focus()}
function renderAcct(){if(!acct)return;
 if(SESSION){const n=window.AUTH_NAME||'Account',op=ROLE==='operator_staff'||ROLE==='admin';
  acct.innerHTML=`<b title="${esc(n)}">${esc(n)}</b>${op?`<button class="btn t sm" type="button" data-act="opview">${S.pax==='OP'?'Passenger view':'Operator view'}</button>`:''}<button class="btn sm" type="button" data-act="authout">Sign out</button>`}
 else acct.innerHTML=`<button class="btn sm" type="button" data-auth="signin">Sign in</button><button class="btn t sm" type="button" data-auth="signup">Create account</button>`}
/* Operator access comes from profiles.role in the database (set manually: db/ops/grant_operator_role.sql). Nobody can pick it themselves.
   IMPROVE: this only decides which screens are shown. Once trips and reservations live in the database, operator data must be restricted by Row Level Security / server checks too. */
async function loadRole(){ROLE=null;if(sb&&SESSION){const{data,error}=await sb.from('profiles').select('role').eq('id',SESSION.user.id).maybeSingle();if(!error&&data)ROLE=data.role}
 if(ROLE!=='operator_staff'&&ROLE!=='admin'&&S.pax==='OP'){S.pax='A';if(S.view==='ops')S.view='find';render()}
 renderAcct()}
function applySession(s){SESSION=s||null;if(!SESSION)ROLE=null;const u=SESSION&&SESSION.user;window.AUTH_NAME=u?((u.user_metadata&&u.user_metadata.full_name)||u.email):null;renderAcct()}
function afterLogin(view){
 if(NOVERIFY){NOVERIFY=false;toast('Warning: email verification is OFF in your Supabase project. Turn on "Confirm email" before launch.')}
 if(view){S.view=view;render();scrollTo(0,0)}else if(dlg.open&&UI.mode==='seat')rSeat()}
function afterLogout(){S.pax='A';ROLE=null;renderAcct();UI.card=null;UI.seat=null;if(dlg.open)dlg.close();if(S.view==='trips'||S.view==='card'||S.view==='report')S.view='find';render()}
/* Clicks: capture phase so the booking code never runs for a signed-out visitor. Browsing routes/fares stays open to everyone. */
document.addEventListener('click',e=>{const t=e.target.closest('[data-auth],[data-act],[data-doc]');if(!t)return;
 if(t.dataset.auth){e.preventDefault();showAuth(t.dataset.auth);return}
 if(t.dataset.doc){const x=document.getElementById('aerr');if(x)x.textContent=t.dataset.doc+' is not published yet. It must be written and legally reviewed (including Data Privacy Act requirements) before launch.';return}
 const a=t.dataset.act;
 if(a==='authclose'){ad.close();return}
 if(a==='authout'){if(sb)sb.auth.signOut();return}
 if(a==='opview'){if(ROLE!=='operator_staff'&&ROLE!=='admin')return;for(const k in S.holds)if(S.holds[k].pax===S.pax)delete S.holds[k];S.pax=S.pax==='OP'?'A':'OP';UI.card=null;UI.seat=null;if(dlg.open)dlg.close();S.view=S.pax==='OP'?'ops':'find';render();renderAcct();return}
 if(!sb||SESSION)return;
 if(a==='book'){e.stopImmediatePropagation();e.preventDefault();showAuth('signin','Sign in or create an account to book this seat. Your seat choice stays on screen, but the hold is short, so it may expire.');return}
 if(a==='nav'&&(t.dataset.v==='trips'||t.dataset.v==='card'||t.dataset.v==='report')){e.stopImmediatePropagation();e.preventDefault();PENDING_VIEW=t.dataset.v;showAuth('signin','Sign in to see your bookings.')}
},true);
ad.addEventListener('close',()=>{PENDING_VIEW=null});
document.addEventListener('submit',async e=>{const f=e.target;if(f.id!=='af')return;e.preventDefault();if(!sb)return;
 const mode=ad.dataset.mode,v=Object.fromEntries(new FormData(f)),err=t=>{document.getElementById('aerr').textContent=t},btn=document.getElementById('asub'),email=(v.email||'').trim().toLowerCase(),limit='Too many attempts. Please wait a few minutes and try again.';
 err('');
 try{
  if(mode==='signup'){const name=(v.name||'').trim(),mob=phone(v.mobile||'');
   if(name.length<2)return err('Enter your full name.');
   if(!mailOk(email))return err('Enter a valid email address.');
   if(!mob)return err('Enter a valid Philippine mobile number, for example 0917 123 4567.');
   if((v.pw||'').length<10)return err('Use a password of at least 10 characters.');
   if(v.pw!==v.pw2)return err('The two passwords do not match.');
   if(!v.terms)return err('You must accept the Terms and Privacy Policy to create an account.');
   btn.disabled=true;btn.textContent='Please wait…';
   const{data,error}=await sb.auth.signUp({email,password:v.pw,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:name,mobile_ph:mob,terms_accepted:true}}});
   if(error)return err(error.status===429?limit:'We could not create the account: '+error.message);
   if(data.session){NOVERIFY=true;return}
   return showAuth('verify','We sent a verification link to <b>'+esc(email)+'</b>.')}
  if(mode==='signin'){if(!mailOk(email)||!v.pw)return err('Enter your email and password.');
   btn.disabled=true;btn.textContent='Please wait…';
   const{error}=await sb.auth.signInWithPassword({email,password:v.pw});
   if(error)return err(error.status===429?limit:/not confirmed/i.test(error.message)?'Please verify your email first. Check your inbox for the verification link.':'Incorrect email or password.');
   return}
  if(mode==='forgot'){if(!mailOk(email))return err('Enter a valid email address.');
   btn.disabled=true;btn.textContent='Please wait…';
   const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
   if(error&&error.status===429)return err(limit);
   return showAuth('verify','If an account exists for <b>'+esc(email)+'</b>, we sent a password reset link.')}
  if(mode==='reset'){if((v.pw||'').length<10)return err('Use a password of at least 10 characters.');
   if(v.pw!==v.pw2)return err('The two passwords do not match.');
   btn.disabled=true;btn.textContent='Please wait…';
   const{error}=await sb.auth.updateUser({password:v.pw});
   if(error)return err('Could not update the password: '+error.message);
   ad.close();toast('Password updated.')}
 }finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=btn.dataset.label}}
});
renderAcct();
if(sb){
 const r=document.getElementById('role');if(r)r.style.display='none'; // demo user/operator switcher is not allowed once real accounts are on
 S.pax='A';save();                                                      // operator tools stay unreachable until real operator accounts exist
 sb.auth.onAuthStateChange((evt,s)=>{applySession(s);if(s)setTimeout(loadRole,0);
  if(evt==='PASSWORD_RECOVERY'){setTimeout(()=>showAuth('reset'),0);return}
  if(evt==='SIGNED_IN'&&s&&ad.open&&ad.dataset.mode!=='reset'&&ad.dataset.mode!=='off'){const v=PENDING_VIEW;PENDING_VIEW=null;setTimeout(()=>{ad.close();afterLogin(v)},0)}
  if(evt==='SIGNED_OUT')setTimeout(afterLogout,0)});
 render();
}
</script>
